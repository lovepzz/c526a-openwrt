name: Build C526A (OpenWrt 25.12 + ipqess + ath10k + mt7615)修复21点04

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget ccache \
            libelf-dev python3-pyelftools patch

      - name: Clone OpenWrt (pinned commit)
        env:
          OPENWRT_COMMIT: 450459bef3b5ba2414abf68feafe60446f53db51
        run: |
          set -e
          git init openwrt
          cd openwrt
          git remote add origin https://github.com/openwrt/openwrt.git
          git fetch --depth 1 origin "$OPENWRT_COMMIT"
          git checkout --detach FETCH_HEAD
          ACTUAL=$(git rev-parse HEAD)
          echo "HEAD = $ACTUAL"
          [ "$ACTUAL" = "$OPENWRT_COMMIT" ] || { echo "!! HEAD mismatch"; exit 1; }
          grep -E '^LINUX_VERSION-' include/kernel-version.mk || true

      - name: Fix patch metadata
        run: |
          set -e
          PATCH="$GITHUB_WORKSPACE/0001-Added-support-for-HIWIFI-c526a-25.12.patch"
          [ -f "$PATCH" ] || { echo "::error::找不到 patch 文件"; exit 1; }
          python3 - "$PATCH" <<'PY'
          import re, sys
          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              lines = f.readlines()
          if lines and not lines[-1].endswith("\n"):
              lines[-1] += "\n"
          out, i, fixed = [], 0, 0
          while i < len(lines):
              line = lines[i]
              if line.startswith("diff --git "):
                  out.append(line); i += 1
                  header = []
                  while (i < len(lines) and not lines[i].startswith("@@")
                         and not lines[i].startswith("diff --git ")):
                      header.append(lines[i]); i += 1
                  if i >= len(lines) or not lines[i].startswith("@@"):
                      out.extend(header); continue
                  while i < len(lines) and lines[i].startswith("@@"):
                      hunk = lines[i]
                      m = re.match(r"^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@(.*)$", hunk)
                      if not m:
                          out.extend(header); header = []
                          out.append(hunk); i += 1; continue
                      old_start = int(m.group(1)); new_start = int(m.group(3))
                      context = m.group(5); i += 1
                      body, a_old, a_new = [], 0, 0
                      while i < len(lines):
                          l = lines[i]
                          if l.startswith("diff --git ") or l.startswith("@@"): break
                          if l.startswith("+"): a_new += 1
                          elif l.startswith("-"): a_old += 1
                          elif l.startswith(" ") or l == "\n" or l == "\t\n":
                              a_old += 1; a_new += 1
                          elif l.startswith("\\"): pass
                          else: break
                          body.append(l); i += 1
                      new_hunk = (f"@@ -{old_start},{a_old} +{new_start},{a_new} @@{context}\n"
                                  if context.strip() else
                                  f"@@ -{old_start},{a_old} +{new_start},{a_new} @@\n")
                      out.extend(header); header = []
                      out.append(new_hunk); out.extend(body); fixed += 1
                  out.extend(header)
              else:
                  out.append(line); i += 1
          with open(path, "w", encoding="utf-8") as f:
              f.writelines(out)
          print(f"已重建 {fixed} 个 hunk 的 @@ 头")
          PY

      - name: Apply C526A patch
        run: |
          set -e
          cd openwrt
          PATCH="$GITHUB_WORKSPACE/0001-Added-support-for-HIWIFI-c526a-25.12.patch"
          git config user.email "build@c526a.local"
          git config user.name "C526A Build"
          if git am --3way "$PATCH"; then
            echo "✅ git am 成功"
          else
            git am --abort 2>/dev/null || true
            echo "git am 失败，尝试 git apply"
            if git apply --3way -v "$PATCH"; then
              echo "✅ git apply 成功"
            else
              echo "git apply 失败，最后用 patch -p1 兜底"
              patch -p1 --no-backup-if-mismatch -f < "$PATCH"
              echo "✅ patch -p1 应用完成"
            fi
          fi
          test -f target/linux/ipq40xx/files-6.12/arch/arm/boot/dts/qcom/qcom-ipq4019-c526a.dts \
            || { echo "!! DTS 不存在"; exit 1; }
          grep -q 'hiwifi_c526a' target/linux/ipq40xx/image/generic.mk \
            || { echo "!! generic.mk 缺失设备定义"; exit 1; }

      - name: Apply mt76 DBDC patch
        run: |
          set -e
          cd openwrt
          PATCH_DIR="package/kernel/mt76/patches"
          mkdir -p "$PATCH_DIR"
          cat > "$PATCH_DIR/999-mt7615-dbdc-band-cap.patch" <<'EOF'
          --- a/mt7615/eeprom.c
          +++ b/mt7615/eeprom.c
          @@ -128,12 +128,12 @@ mt7615_eeprom_parse_hw_band_cap(struct mt7615_dev *dev)
           	case MT_EE_5GHZ:
           		dev->mphy.cap.has_5ghz = true;
           		break;
          -	case MT_EE_2GHZ:
          -		dev->mphy.cap.has_2ghz = true;
          -		break;
           	case MT_EE_DBDC:
           		dev->dbdc_support = true;
           		fallthrough;
          +	case MT_EE_2GHZ:
          +		dev->mphy.cap.has_2ghz = true;
          +		break;
           	default:
           		dev->mphy.cap.has_2ghz = true;
           		dev->mphy.cap.has_5ghz = true;
          EOF
          echo "✅ DBDC 补丁已写入：$PATCH_DIR/999-mt7615-dbdc-band-cap.patch"
          [ -s "$PATCH_DIR/999-mt7615-dbdc-band-cap.patch" ] \
            || { echo "!! 补丁文件写入失败"; exit 1; }
          echo "=== DBDC 补丁注入完成 ==="

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Fix uboot-tools envtools (Exec format error)
        run: |
          set -e
          cd openwrt

          MK=$(find package/boot -path '*/uboot-tools/Makefile' 2>/dev/null | head -n1)
          if [ -z "$MK" ]; then
            echo "!! 找不到 uboot-tools/Makefile"
            find package/boot -maxdepth 3 -type d -name 'uboot-tools*' 2>/dev/null || true
            exit 1
          fi
          echo "找到 Makefile：$MK"

          python3 - "$MK" <<'PY'
          import re, sys

          MK = sys.argv[1]
          s = open(MK, encoding="utf-8").read()

          if "tools-only_defconfig" not in s:
              s = re.sub(
                  r"(define Build/Configure\n)((?:.*\n)*?)(endef)",
                  r"\1\t$(call Build/Compile/Default,tools-only_defconfig)\n\3",
                  s, count=1
              )

          new_build_compile = (
              "define Build/Compile\n"
              "\t+$(MAKE) $(PKG_JOBS) -C $(PKG_BUILD_DIR) \\\n"
              "\t\tCROSS_COMPILE=\"\" \\\n"
              "\t\tARCH=sandbox \\\n"
              "\t\tenvtools\n"
              "endef"
          )

          if "define Build/Compile" in s:
              s = re.sub(r"define Build/Compile\n(?:.*\n)*?endef", new_build_compile, s)
          else:
              s = s.replace(
                  "include $(INCLUDE_DIR)/package.mk",
                  "include $(INCLUDE_DIR)/package.mk\n\n" + new_build_compile
              )

          open(MK, "w", encoding="utf-8").write(s)
          print("✅ uboot-tools Makefile 已修复 (ARCH=sandbox)")
          PY

          grep -q "tools-only_defconfig" "$MK" || { echo "!! tools-only_defconfig 未写入"; exit 1; }
          grep -q "ARCH=sandbox" "$MK" || { echo "!! ARCH=sandbox 未写入"; exit 1; }
          echo "=== uboot-tools 修复完成 ==="

      - name: Add uci-defaults (LAN IP + WiFi + mt7615 reboot fix)
        run: |
          set -e
          cd openwrt
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-c526a-network <<'EOF'
          #!/bin/sh
          uci set network.lan.ipaddr='10.0.0.3'
          uci set network.lan.netmask='255.255.255.0'
          uci commit network
          uci set wireless.@wifi-device[0].disabled='0'
          uci set wireless.@wifi-device[1].disabled='0'
          uci set wireless.@wifi-device[2].disabled='0'
          uci commit wireless
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-c526a-network

          mkdir -p files/etc/init.d files/etc/rc.d
          cat > files/etc/init.d/mt7615_reboot <<'EOF'
          #!/bin/sh /etc/rc.common
          STOP=52
          stop() {
              rmmod mt7615e 2>/dev/null
          }
          EOF
          chmod +x files/etc/init.d/mt7615_reboot
          ln -sf ../init.d/mt7615_reboot files/etc/rc.d/K52mt7615_reboot
          echo "=== uci-defaults & mt7615_reboot 脚本 ==="
          ls -la files/etc/uci-defaults/ files/etc/init.d/mt7615_reboot files/etc/rc.d/K52mt7615_reboot

      - name: Load config
        run: |
          set -e
          cd openwrt
          cp "$GITHUB_WORKSPACE/config-25.12-c526a" .config
          make defconfig
          for opt in CONFIG_PACKAGE_kmod-ath10k-ct \
                     CONFIG_PACKAGE_ath10k-firmware-qca4019-ct ; do
            if grep -q "^${opt}=" .config; then
              sed -i "s|^${opt}=.*|# ${opt} is not set|" .config
            else
              printf '# %s is not set\n' "$opt" >> .config
            fi
          done
          grep -E 'CONFIG_PACKAGE_(kmod-ath10k|ath10k-firmware|kmod-mt7615e|kmod-mt76)' .config || true

      - name: Verify
        run: |
          cd openwrt
          FAIL=0
          grep -E 'CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)' .config || true
          grep -A15 'define Device/hiwifi_c526a' target/linux/ipq40xx/image/generic.mk \
            || { echo "  [MISS] 设备定义缺失"; FAIL=1; }
          ls -la target/linux/ipq40xx/files-6.12/arch/arm/boot/dts/qcom/qcom-ipq4019-c526a.dts \
            || { echo "  [MISS] DTS 缺失"; FAIL=1; }
          for opt in CONFIG_PACKAGE_kmod-ath10k CONFIG_PACKAGE_ath10k-firmware-qca4019 ; do
            if grep -qx "${opt}=y" .config; then echo "  [OK] ${opt}=y"
            else echo "  [MISS] ${opt}"; FAIL=1; fi
          done
          for opt in CONFIG_PACKAGE_kmod-mt7615e CONFIG_PACKAGE_kmod-mt7615-firmware \
                     CONFIG_PACKAGE_kmod-mt76-connac CONFIG_PACKAGE_kmod-mt76-core ; do
            if grep -qx "${opt}=y" .config; then echo "  [OK] ${opt}=y"
            else echo "  [MISS] ${opt}"; FAIL=1; fi
          done
          if [ ! -s package/kernel/mt76/patches/999-mt7615-dbdc-band-cap.patch ]; then
            echo "  [MISS] DBDC 补丁文件缺失或为空"; FAIL=1
          else
            echo "  [OK] DBDC 补丁文件已就位"
          fi
          MK=$(find package/boot -path '*/uboot-tools/Makefile' 2>/dev/null | head -n1)
          if [ -z "$MK" ] || ! grep -q "tools-only_defconfig" "$MK" || ! grep -q "ARCH=sandbox" "$MK"; then
            echo "  [MISS] uboot-tools 未修复"; FAIL=1
          else
            echo "  [OK] uboot-tools 已修复"
          fi
          if [ "$FAIL" -ne 0 ]; then echo "!! 自检失败"; exit 1; fi
          echo "=== 全部自检通过 ==="

      - name: Download package sources
        run: |
          cd openwrt
          make -j$(nproc) download

      - name: Build
        run: |
          set -o pipefail
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Show tail of build log
        if: always()
        run: |
          cd openwrt
          tail -120 build.log || true
          grep -n -i -E "error|failed to build" build.log | tail -60 || true

      - name: Assert firmware produced
        if: always()
        run: |
          cd openwrt
          FAIL=0
          ls -la bin/targets/ipq40xx/generic/ 2>/dev/null || true
          SU=$(find bin/targets/ipq40xx/generic -maxdepth 1 -name '*hiwifi_c526a*sysupgrade.bin' -print -quit 2>/dev/null || true)
          if [ -n "$SU" ] && [ -s "$SU" ]; then echo "  [OK] sysupgrade = $SU ($(wc -c < "$SU") B)"
          else echo "  [MISS] sysupgrade.bin"; FAIL=1; fi
          FU=$(find bin/targets/ipq40xx/generic -maxdepth 1 -name '*hiwifi_c526a*squashfs-factory.ubi' -print -quit 2>/dev/null || true)
          if [ -n "$FU" ] && [ -s "$FU" ]; then echo "  [OK] factory.ubi = $FU ($(wc -c < "$FU") B)"
          else echo "  [MISS] factory.ubi"; FAIL=1; fi
          [ "$FAIL" -eq 0 ] || exit 1
          echo "=== 产物断言通过 ==="

      - name: Prepare artifacts
        if: always()
        run: |
          mkdir -p output
          cd openwrt
          find bin/targets/ipq40xx -type f \( -name "*.bin" -o -name "*.ubi" -o -name "*.itb" \
            -o -name "*metadata*" -o -name "profiles.json" -o -name "*.buildinfo" \) \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \; 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/output/"

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c526a-25.12-ipqess-ath10k-mt7615-wifi
          path: output/
          if-no-files-found: error
          retention-days: 30
