name: 构建改dts文件这次 C526A (OpenWrt 25.12 + ipqess + ath10k + WiFi)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget ccache \
            libelf-dev python3-pyelftools

      - name: Clone OpenWrt (pinned commit)
        env:
          OPENWRT_COMMIT: 450459bef3b5ba2414abf68feafe60446f53db51
        run: |
          set -e
          git init openwrt
          cd openwrt
          git remote add origin https://github.com/openwrt/openwrt.git
          git fetch --depth 1 origin "$OPENWRT_COMMIT"
          git checkout --detach FETCH_HEAD
          ACTUAL=$(git rev-parse HEAD)
          echo "HEAD = $ACTUAL"
          [ "$ACTUAL" = "$OPENWRT_COMMIT" ] || { echo "!! HEAD mismatch"; exit 1; }
          grep -E '^LINUX_VERSION-' include/kernel-version.mk || true

      - name: Apply C526A patch
        run: |
          set -e
          cd openwrt
          git config user.email "build@c526a.local"
          git config user.name "C526A Build"
          git am --3way "$GITHUB_WORKSPACE/0001-Added-support-for-HIWIFI-c526a-25.12.patch" \
            || (git am --abort 2>/dev/null || true; \
                git apply --3way -v "$GITHUB_WORKSPACE/0001-Added-support-for-HIWIFI-c526a-25.12.patch")
          test -f target/linux/ipq40xx/files-6.12/arch/arm/boot/dts/qcom/qcom-ipq4019-c526a.dts \
            || { echo "!! DTS 不存在"; exit 1; }
          grep -q 'hiwifi_c526a' target/linux/ipq40xx/image/generic.mk \
            || { echo "!! generic.mk 缺失设备定义"; exit 1; }

      - name: Ensure official ath10k in generic.mk
        run: |
          set -e
          cd openwrt
          MK=target/linux/ipq40xx/image/generic.mk
          if grep -q 'kmod-ath10k-ct' "$MK"; then
            sed -i 's/kmod-ath10k-ct ath10k-firmware-qca4019-ct/kmod-ath10k ath10k-firmware-qca4019 ath10k-board-qca4019/g' "$MK"
            echo "已替换 DEVICE_PACKAGES 中的 CT 包为官方包"
          fi
          echo "=== generic.mk 中的 DEVICE_PACKAGES ==="
          grep -A12 'define Device/hiwifi_c526a' "$MK" | grep 'DEVICE_PACKAGES' || true

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add uci-defaults (LAN IP + WiFi)
        run: |
          set -e
          cd openwrt
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-c526a-network <<'EOF'
          #!/bin/sh
          # LAN IP 10.0.0.3/24
          uci set network.lan.ipaddr='10.0.0.3'
          uci set network.lan.netmask='255.255.255.0'
          uci commit network

          # 启用所有 Wi-Fi 射频
          uci set wireless.@wifi-device[0].disabled='0'
          uci set wireless.@wifi-device[1].disabled='0'
          uci set wireless.@wifi-device[2].disabled='0'
          uci commit wireless

          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-c526a-network
          echo "=== uci-defaults 内容 ==="
          cat files/etc/uci-defaults/99-c526a-network

      - name: Load config
        run: |
          set -e
          cd openwrt
          cp "$GITHUB_WORKSPACE/config-25.12-c526a" .config
          make defconfig

          # ================================================================
          # 后备保险：强制禁用 CT 驱动（defconfig 之后写死，不再 defconfig）
          # ================================================================
          echo "=== 后备：强制禁用 CT 驱动 ==="
          for opt in CONFIG_PACKAGE_kmod-ath10k-ct \
                     CONFIG_PACKAGE_ath10k-firmware-qca4019-ct ; do
            if grep -q "^${opt}=" .config; then
              sed -i "s|^${opt}=.*|# ${opt} is not set|" .config
            else
              printf '# %s is not set\n' "$opt" >> .config
            fi
          done

          echo "=== 关键配置确认 ==="
          grep -E 'CONFIG_TARGET_ipq40xx|CONFIG_PACKAGE_(kmod-ath10k|ath10k-firmware|opkg)' .config || true
          echo "=== generic.mk 中的 DEVICE_PACKAGES（构建实际使用的值）==="
          grep -A12 'define Device/hiwifi_c526a' target/linux/ipq40xx/image/generic.mk | grep 'DEVICE_PACKAGES' || true

      - name: Verify
        run: |
          cd openwrt
          FAIL=0

          echo "=== target ==="
          grep -E 'CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)' .config || true

          echo "=== 设备定义 ==="
          if grep -A20 'define Device/hiwifi_c526a' target/linux/ipq40xx/image/generic.mk >/dev/null 2>&1; then
            echo "  [OK]   设备定义存在"
          else
            echo "  [MISS] 设备定义缺失"; FAIL=1
          fi

          echo "=== DTS ==="
          if [ -f target/linux/ipq40xx/files-6.12/arch/arm/boot/dts/qcom/qcom-ipq4019-c526a.dts ]; then
            echo "  [OK]   DTS 已落地"
          else
            echo "  [MISS] DTS 缺失"; FAIL=1
          fi

          echo "=== ★ 官方 ath10k（.config 必须全 OK）==="
          for opt in CONFIG_PACKAGE_kmod-ath10k \
                     CONFIG_PACKAGE_ath10k-firmware-qca4019 \
                     CONFIG_PACKAGE_ath10k-board-qca4019 ; do
            if grep -qx "${opt}=y" .config; then
              echo "  [OK]   ${opt}=y"
            else
              echo "  [MISS] ${opt}"; FAIL=1
            fi
          done

          echo "=== ★ 反向：CT 驱动必须不存在 ==="
          if grep -qx 'CONFIG_PACKAGE_kmod-ath10k-ct=y' .config; then
            echo "  [BAD]  kmod-ath10k-ct 仍为 y"; FAIL=1
          else
            echo "  [OK]   kmod-ath10k-ct 未启用"
          fi
          if grep -qx 'CONFIG_PACKAGE_ath10k-firmware-qca4019-ct=y' .config; then
            echo "  [BAD]  ath10k-firmware-qca4019-ct 仍为 y"; FAIL=1
          else
            echo "  [OK]   ath10k-firmware-qca4019-ct 未启用"
          fi

          echo "=== ★ generic.mk 中的 DEVICE_PACKAGES（真正决定编译依赖）==="
          DP=$(grep -A12 'define Device/hiwifi_c526a' target/linux/ipq40xx/image/generic.mk | grep 'DEVICE_PACKAGES' || true)
          if [ -n "$DP" ]; then
            echo "  $DP"
            case "$DP" in
              *kmod-ath10k-ct*) echo "  [BAD]  DEVICE_PACKAGES 仍含 CT 驱动"; FAIL=1 ;;
              *kmod-ath10k*)    echo "  [OK]   DEVICE_PACKAGES 含官方 kmod-ath10k" ;;
              *)                echo "  [WARN] DEVICE_PACKAGES 未显式列出 kmod-ath10k（可能由 .config 提供）" ;;
            esac
          else
            echo "  [INFO] generic.mk 中未定义 DEVICE_PACKAGES，依赖 .config 中的 CONFIG_PACKAGE_*"
          fi

          echo "=== uci-defaults ==="
          UCI=files/etc/uci-defaults/99-c526a-network
          if [ -f "$UCI" ]; then
            echo "  [OK]   文件存在：$UCI"
            if grep -q "10.0.0.3" "$UCI"; then
              echo "  [OK]   LAN IP = 10.0.0.3"
            else
              echo "  [MISS] 未找到 10.0.0.3"; FAIL=1
            fi
            if grep -q "wifi-device\[0\].disabled='0'" "$UCI"; then
              echo "  [OK]   WiFi 启用指令存在"
            else
              echo "  [MISS] WiFi 启用指令缺失"; FAIL=1
            fi
            echo "  --- 文件内容 ---"
            cat "$UCI"
          else
            echo "  [MISS] 文件不存在：$UCI"; FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "!! 自检失败"; exit 1
          fi
          echo "=== 全部自检通过 ==="

      - name: Download package sources
        run: |
          cd openwrt
          make -j$(nproc) download

      - name: Build
        run: |
          set -o pipefail
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Show tail of build log
        if: always()
        run: |
          cd openwrt
          tail -120 build.log || true
          grep -n -i -E "error|failed to build" build.log | tail -60 || true

      - name: Assert firmware produced
        if: always()
        run: |
          cd openwrt
          FAIL=0
          echo "=== bin/targets/ipq40xx/generic ==="
          ls -la bin/targets/ipq40xx/generic/ 2>/dev/null || true

          SU=$(find bin/targets/ipq40xx/generic -maxdepth 1 -name '*hiwifi_c526a*sysupgrade.bin' -print -quit 2>/dev/null || true)
          if [ -n "$SU" ] && [ -s "$SU" ]; then
            echo "  [OK] sysupgrade = $SU ($(wc -c < "$SU") B)"
          else
            echo "  [MISS] sysupgrade.bin"; FAIL=1
          fi

          FU=$(find bin/targets/ipq40xx/generic -maxdepth 1 -name '*hiwifi_c526a*squashfs-factory.ubi' -print -quit 2>/dev/null || true)
          if [ -n "$FU" ] && [ -s "$FU" ]; then
            echo "  [OK] factory.ubi = $FU ($(wc -c < "$FU") B)"
          else
            echo "  [MISS] factory.ubi"; FAIL=1
          fi

          [ "$FAIL" -eq 0 ] || exit 1
          echo "=== 产物断言通过 ==="

      - name: Prepare artifacts
        if: always()
        run: |
          mkdir -p output
          cd openwrt
          find bin/targets/ipq40xx -type f \( -name "*.bin" -o -name "*.ubi" -o -name "*.itb" \
            -o -name "*metadata*" -o -name "profiles.json" -o -name "*.buildinfo" \) \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \; 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/output/"

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c526a-25.12-ath10k-wifi
          path: output/
          if-no-files-found: error
          retention-days: 30
