# ============================================================================
# HiWiFi C526A (极路由X) — OpenWrt 24.10 + 完整 LuCI 中文 + 三频 WiFi + 信道自由 + 功率解锁
#
# 特点：
#  1) 源码：openwrt/openwrt 分支 openwrt-24.10（内核 6.6，ipqess + DSA）
#  2) 应用仓库根目录的 C526A 补丁
#  3) 补丁默认关闭 Wi-Fi，workflow 自动追加 &wifi0/&wifi1/&wifi2 节点将其启用
#  4) 为两个 5G 射频添加 ieee80211-freq-limit，解决信道无法更改、频段错乱问题
#  5) 修改 wireless-regdb，解锁 2.4G/5G 功率限制，统一上限为 30 dBm
#  6) 启用 CONFIG_ATH_USER_REGD，让驱动尊重用户空间监管设置
#  7) 默认 LAN IP 改为 10.0.0.5（首次启动时通过 uci-defaults 自动应用）
#  8) 首次启动自动固定各射频信道（radio0=6, radio1=36, radio2=149）
#  9) country=00（世界监管域），配合已解锁的 regdb，信道和功率均放开
# 10) 两个 5G 射频必须使用不同信道，否则其中一个无法正常工作（C526A 硬件特性）
# 11) 不添加任何第三方 feed，全部使用官方 feed
# 12) 不含 PassWall，不含旁路由模式
#
# 需要放在仓库根目录的文件：
#   - 0001-Added-support-for-HIWIFI-c526a-24.10.patch
#   - config-24.10-c526a
# ============================================================================

name: Build 极路由X (OpenWrt 24.10 + LuCI + 三频WiFi + 信道自由 + 功率解锁)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-24.10

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      # ----------------------------------------------------------------------
      # 1. 检出仓库
      # ----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # 2. 校验仓库必需文件是否齐全
      # ----------------------------------------------------------------------
      - name: Verify repo files
        run: |
          ls -la
          test -f 0001-Added-support-for-HIWIFI-c526a-24.10.patch \
            || { echo "!! 缺少 C526A 补丁"; exit 1; }
          test -f config-24.10-c526a \
            || { echo "!! 缺少 config-24.10-c526a"; exit 1; }
          echo OK

      # ----------------------------------------------------------------------
      # 3. 释放磁盘空间
      # ----------------------------------------------------------------------
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h /

      # ----------------------------------------------------------------------
      # 4. 安装编译依赖
      # ----------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget ccache \
            libelf-dev python3-pyelftools

      # ----------------------------------------------------------------------
      # 5. ccache 缓存
      # ----------------------------------------------------------------------
      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref }}-
            ccache-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true
          ccache -z
          ccache -s

      # ----------------------------------------------------------------------
      # 6. 克隆 OpenWrt 24.10 源码
      # ----------------------------------------------------------------------
      - name: Clone OpenWrt 24.10
        run: |
          set -e
          git clone --depth 1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "=== 源码版本 ==="
          git log --oneline -1
          echo "=== 内核版本 ==="
          grep -E '^LINUX_VERSION-' include/kernel-version.mk || true

      # ----------------------------------------------------------------------
      # 7. 应用 C526A 设备支持补丁
      # ----------------------------------------------------------------------
      - name: Apply C526A patch
        run: |
          set -e
          cd openwrt
          PATCH="$GITHUB_WORKSPACE/0001-Added-support-for-HIWIFI-c526a-24.10.patch"
          git config user.email "build@c526a.local"
          git config user.name "C526A Build"

          if git am --3way "$PATCH"; then
            echo "git am 成功"
          else
            echo "=== git am 失败，改用 git apply --3way ==="
            git am --abort 2>/dev/null || true
            git apply --3way -v "$PATCH" || { echo "!! 补丁无法应用"; exit 1; }
            echo "git apply 成功"
          fi

          echo "=== 补丁落地自检 ==="
          grep -q 'hiwifi_c526a' target/linux/ipq40xx/image/generic.mk \
            || { echo "!! generic.mk 里没有 hiwifi_c526a"; exit 1; }
          grep -q 'hiwifi,c526a' target/linux/ipq40xx/base-files/etc/board.d/02_network \
            || { echo "!! 02_network 里没有 c526a"; exit 1; }
          grep -q 'hiwifi,c526a' target/linux/ipq40xx/base-files/etc/hotplug.d/firmware/11-ath10k-caldata \
            || { echo "!! 11-ath10k-caldata 里没有 c526a"; exit 1; }
          test -f target/linux/ipq40xx/files-6.6/arch/arm/boot/dts/qcom/qcom-ipq4019-c526a.dts \
            || { echo "!! DTS 未落地"; exit 1; }
          echo "补丁落地自检通过"

      # ----------------------------------------------------------------------
      # 8. 解锁功率限制：修改 wireless-regdb 数据库
      #    将 2.4G 与 5G 各频段的功率上限统一改为 30 dBm
      # ----------------------------------------------------------------------
      - name: Unlock power limit in regdb.txt
        run: |
          set -e
          cd openwrt

          REGDB="package/firmware/wireless-regdb/db.txt"
          if [ ! -f "$REGDB" ]; then
            REGDB="package/kernel/mac80211/files/regdb.txt"
          fi

          if [ ! -f "$REGDB" ]; then
            echo "!! 未找到 regdb 文件，跳过功率解锁"
            exit 0
          fi

          echo "=== 找到 regdb 文件: $REGDB ==="
          cp "$REGDB" "${REGDB}.bak"

          python3 - << 'PYEOF'
import re, os

regdb_path = "package/firmware/wireless-regdb/db.txt"
if not os.path.exists(regdb_path):
    regdb_path = "package/kernel/mac80211/files/regdb.txt"

if os.path.exists(regdb_path):
    with open(regdb_path, 'r') as f:
        content = f.read()

    # 2.4G 频段
    content = re.sub(r'(\(2402 - 2472 @ 40\),\s*\(N/A,)\s*\d+\)', r'\1 30)', content)
    # 5G 各频段
    content = re.sub(r'(\(5170 - 5250 @ 80\),\s*\(N/A,)\s*\d+\)', r'\1 30)', content)
    content = re.sub(r'(\(5250 - 5330 @ 80\),\s*\(N/A,)\s*\d+\)', r'\1 30)', content)
    content = re.sub(r'(\(5490 - 5710 @ 80\),\s*\(N/A,)\s*\d+\)', r'\1 30)', content)
    content = re.sub(r'(\(5735 - 5835 @ 80\),\s*\(N/A,)\s*\d+\)', r'\1 30)', content)

    with open(regdb_path, 'w') as f:
        f.write(content)

    print(f"=== 已修改 {regdb_path}，功率上限统一为 30 dBm ===")
else:
    print("!! 未找到 regdb 文件")
PYEOF

          echo "=== 修改后的功率行（供核对）==="
          grep -E "2402 - 2472|5170 - 5250|5250 - 5330|5490 - 5710|5735 - 5835" "$REGDB" | head -20 || true

      # ----------------------------------------------------------------------
      # 9. 启用 Wi-Fi 并配置 DTS（三频分离 + 信道自由）
      #    为两个 5G 射频加 ieee80211-freq-limit，解决频段错乱和信道无法更改
      #    wifi1 = 5G 低频段（信道 36-64）
      #    wifi2 = 5G 高频段（信道 100-165）
      # ----------------------------------------------------------------------
      - name: Enable Wi-Fi in DTS
        run: |
          set -e
          cd openwrt
          DTS=target/linux/ipq40xx/files-6.6/arch/arm/boot/dts/qcom/qcom-ipq4019-c526a.dts

          if ! grep -q '^&wifi0' "$DTS"; then
            {
              echo ""
              echo '&wifi0 {'
              echo '	status = "okay";'
              echo '	qcom,ath10k-calibration-variant = "C526A";'
              echo '};'
              echo ""
              echo '&wifi1 {'
              echo '	status = "okay";'
              echo '	qcom,ath10k-calibration-variant = "C526A";'
              echo '	ieee80211-freq-limit = <5170000 5330000>;'   # 5G 低频段（信道 36-64）
              echo '};'
              echo ""
              echo '&wifi2 {'
              echo '	status = "okay";'
              echo '	qcom,ath10k-calibration-variant = "C526A";'
              echo '	ieee80211-freq-limit = <5490000 5835000>;'   # 5G 高频段（信道 100-165）
              echo '};'
            } >> "$DTS"
          else
            echo "DTS 中已存在 &wifi0，跳过追加"
          fi

          echo "=== DTS 末尾 40 行 ==="
          tail -40 "$DTS"

      # ----------------------------------------------------------------------
      # 10. 更新并安装 feeds
      # ----------------------------------------------------------------------
      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ----------------------------------------------------------------------
      # 11. 移除 radicale3 的失效依赖
      # ----------------------------------------------------------------------
      - name: Remove radicale3 broken dependency
        run: |
          cd openwrt
          if [ -f feeds/luci/applications/luci-app-radicale3/Makefile ]; then
            sed -i 's/ +rpcd-mod-rad3-enc//g' feeds/luci/applications/luci-app-radicale3/Makefile
          fi
          if [ -f package/feeds/luci/luci-app-radicale3/Makefile ]; then
            sed -i 's/ +rpcd-mod-rad3-enc//g' package/feeds/luci/luci-app-radicale3/Makefile
          fi

      # ----------------------------------------------------------------------
      # 12. 设置默认 LAN IP 为 10.0.0.5
      # ----------------------------------------------------------------------
      - name: Set default LAN IP to 10.0.0.5
        run: |
          set -e
          cd openwrt
          mkdir -p files/etc/uci-defaults
          {
            echo '#!/bin/sh'
            echo "uci set network.lan.ipaddr='10.0.0.5'"
            echo "uci set network.lan.netmask='255.255.255.0'"
            echo "uci -q delete dhcp.lan.dhcp_option || true"
            echo "uci add_list dhcp.lan.dhcp_option='3,10.0.0.5'"
            echo "uci add_list dhcp.lan.dhcp_option='6,10.0.0.5'"
            echo "uci commit network"
            echo "uci commit dhcp"
            echo "exit 0"
          } > files/etc/uci-defaults/99-custom-lan-ip
          chmod +x files/etc/uci-defaults/99-custom-lan-ip
          echo "=== 自定义 uci-defaults ==="
          cat files/etc/uci-defaults/99-custom-lan-ip

      # ----------------------------------------------------------------------
      # 13. 设置无线默认配置
      #     country=00 为世界监管域，配合已解锁的 regdb，信道和功率均放开
      #     两个 5G 射频必须使用不同信道，否则其中一个无法正常工作
      # ----------------------------------------------------------------------
      - name: Set default wireless config
        run: |
          set -e
          cd openwrt
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/98-custom-wireless << 'EOF'
#!/bin/sh

# --- 2.4G 射频 ---
uci set wireless.radio0.country='00'
uci set wireless.radio0.channel='6'
uci set wireless.radio0.htmode='HT20'
uci set wireless.radio0.disabled='0'

# --- 5G 低频射频（信道 36-64）---
uci set wireless.radio1.country='00'
uci set wireless.radio1.channel='36'
uci set wireless.radio1.htmode='VHT80'
uci set wireless.radio1.disabled='0'

# --- 5G 高频射频（信道 100-165）---
uci set wireless.radio2.country='00'
uci set wireless.radio2.channel='149'
uci set wireless.radio2.htmode='VHT80'
uci set wireless.radio2.disabled='0'

uci commit wireless
exit 0
EOF
          chmod +x files/etc/uci-defaults/98-custom-wireless
          echo "=== 无线默认配置 ==="
          cat files/etc/uci-defaults/98-custom-wireless

      # ----------------------------------------------------------------------
      # 14. 加载 config，并强制追加功率相关编译选项
      # ----------------------------------------------------------------------
      - name: Load config
        run: |
          set -e
          cd openwrt
          cp "$GITHUB_WORKSPACE/config-24.10-c526a" .config

          # 让 ath10k 尊重用户空间监管设置（而非死守 EEPROM）
          echo "CONFIG_ATH_USER_REGD=y" >> .config
          # 放宽 cfg80211 监管检查
          echo "CONFIG_CFG80211_CERTIFICATION_ONUS=y" >> .config

          echo "=== 第一轮 defconfig ==="
          make defconfig
          echo "=== 第二轮 defconfig（收敛）==="
          make defconfig

          echo "=== feeds 里实际存在的中文语言包（供核对包名）==="
          find feeds/luci -maxdepth 4 -type d -name 'luci-i18n-*-zh*' 2>/dev/null | sort || true
          echo ""

          echo "=== 关键配置检查（仅警告，不中断）==="
          WARN=0
          for opt in \
            CONFIG_TARGET_ipq40xx_generic_DEVICE_hiwifi_c526a \
            CONFIG_PACKAGE_luci \
            CONFIG_ATH_USER_REGD; do
            if grep -qx "${opt}=y" .config; then
              echo "  [OK]   ${opt}=y"
            else
              echo "  [WARN] ${opt} 未出现"
              WARN=1
            fi
          done

          if grep -qE '^CONFIG_PACKAGE_luci-i18n-base-zh_Hans=y' .config; then
            echo "  [OK]   中文语言包已选中："
            grep -E '^CONFIG_PACKAGE_luci-i18n-.*-zh_Hans=y' .config | head -20
          else
            echo "  [WARN] 未检测到任何 luci-i18n-*-zh_Hans 语言包"
            echo "         请查看上面 'feeds 里实际存在的' 列表，确认包名"
            WARN=1
          fi

          echo ""
          echo "config 加载完成，共 $(wc -l < .config) 行"
          [ "$WARN" -eq 0 ] && echo "全部关键项 OK" || echo "有警告，但继续构建"
          exit 0

      # ----------------------------------------------------------------------
      # 15. 下载软件包源码
      # ----------------------------------------------------------------------
      - name: Download package sources
        run: |
          cd openwrt
          make -j$(nproc) download

      # ----------------------------------------------------------------------
      # 16. 正式编译
      # ----------------------------------------------------------------------
      - name: Build
        run: |
          set -o pipefail
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tee build.log

      # ----------------------------------------------------------------------
      # 17. ccache 统计
      # ----------------------------------------------------------------------
      - name: ccache stats
        if: always()
        run: |
          ccache -s || true

      # ----------------------------------------------------------------------
      # 18. 输出编译日志尾部
      # ----------------------------------------------------------------------
      - name: Show tail of build log
        if: always()
        run: |
          cd openwrt
          tail -120 build.log || true
          echo "=== 错误行 ==="
          grep -n -i -E "error|failed to build" build.log | tail -60 || true

      # ----------------------------------------------------------------------
      # 19. 断言固件是否产出
      # ----------------------------------------------------------------------
      - name: Assert firmware produced
        if: always()
        run: |
          cd openwrt
          ls -la bin/targets/ipq40xx/generic/ 2>/dev/null || true
          FAIL=0
          grep -qx 'CONFIG_TARGET_ipq40xx_generic_DEVICE_hiwifi_c526a=y' .config \
            || { echo "  [MISS] .config 里没有 C526A 设备项"; FAIL=1; }
          SU=$(find bin/targets/ipq40xx/generic -maxdepth 1 -type f \
                 -name '*hiwifi_c526a*sysupgrade.bin' -print -quit 2>/dev/null || true)
          [ -n "$SU" ] && [ -s "$SU" ] \
            && echo "  [OK] sysupgrade = $SU" \
            || { echo "  [MISS] 未产出 sysupgrade.bin"; FAIL=1; }
          FU=$(find bin/targets/ipq40xx/generic -maxdepth 1 -type f \
                 -name '*hiwifi_c526a*squashfs-factory.ubi' -print -quit 2>/dev/null || true)
          [ -n "$FU" ] && [ -s "$FU" ] \
            && echo "  [OK] factory.ubi = $FU" \
            || { echo "  [MISS] 未产出 factory.ubi"; FAIL=1; }
          IR=$(find bin/targets/ipq40xx/generic -maxdepth 1 -type f \
                 -name '*hiwifi_c526a*initramfs*' -print -quit 2>/dev/null || true)
          [ -n "$IR" ] && [ -s "$IR" ] \
            && echo "  [OK] initramfs = $IR" \
            || { echo "  [MISS] 未产出 initramfs"; FAIL=1; }
          [ "$FAIL" -eq 0 ] || { echo "!! 产物断言失败"; tail -60 build.log; exit 1; }
          echo "产物断言通过"

      # ----------------------------------------------------------------------
      # 20. 收集产物
      # ----------------------------------------------------------------------
      - name: Prepare artifacts
        if: always()
        run: |
          mkdir -p output
          cd openwrt
          find bin/targets/ipq40xx -type f \( -name "*.bin" -o -name "*.ubi" -o -name "*.itb" \
            -o -name "*metadata*" -o -name "profiles.json" -o -name "*.buildinfo" \) \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \; 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/output/"

      # ----------------------------------------------------------------------
      # 21. 上传固件
      # ----------------------------------------------------------------------
      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c526a-24.10-luci-wifi-channel-free-power-unlock
          path: output/
          if-no-files-found: error
          retention-days: 30

      # ----------------------------------------------------------------------
      # 22. 上传编译日志
      # ----------------------------------------------------------------------
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log
          if-no-files-found: ignore
          retention-days: 7
