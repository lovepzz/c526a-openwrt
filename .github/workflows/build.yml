# ============================================================================
# HiWiFi C526A (极路由X) — Lienol 24.10 + C526A 补丁 + PassWall
#
# 关键设定：
#  1) 克隆 Lienol OpenWrt 24.10 源码（按下方 REPO_BRANCH 变量）
#  2) 应用仓库根目录的 0001-Added-support-for-HIWIFI-c526a-24.10.patch
#  3) 所有 feed 使用 ^ 前缀，跳过下载哈希校验
#  4) 无线校准从 ART 分区提取，不依赖 ipq-wifi-hiwifi_c526a（若你的补丁
#     自带该包则可保留，workflow 会自适应）
#
# 用法：
#   1. 把本文件放到仓库 .github/workflows/build.yml
#   2. 把补丁文件放到仓库根目录：
#        0001-Added-support-for-HIWIFI-c526a-24.10.patch
#   3. 把 config 种子文件放到仓库根目录：
#        config-lienol-c526a
#   4. Actions → Build C526A → Run workflow
# ============================================================================

name: Build C526A (Lienol 24.10 + C526A patch + PassWall)

on:
  workflow_dispatch:

env:
  # Lienol 仓库常见分支：
  #   dev-master      —— 滚动主线，跟随较新上游（推荐先试这个）
  #   dev-lean-lede   —— 基于 Lean 的 LEDE
  #   dev-19.07       —— 老分支
  # 若你的补丁明确基于 24.10，请把这里改成对应分支名。
  REPO_URL: https://github.com/Lienol/openwrt.git
  REPO_BRANCH: dev-master

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo files (debug)
        run: |
          echo "=== 仓库根目录文件 ==="
          ls -la
          echo "=== 确认补丁存在 ==="
          ls -la 0001-Added-support-for-HIWIFI-c526a-24.10.patch

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget ccache \
            libelf-dev python3-pyelftools

      - name: Clone Lienol OpenWrt
        run: |
          set -e
          echo "克隆 $REPO_URL 分支 $REPO_BRANCH"
          git clone --depth 1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "=== 源码版本 ==="
          git log --oneline -1
          echo "=== 内核版本（决定补丁路径 files-X.Y）==="
          grep -E '^LINUX_VERSION-' include/kernel-version.mk || true

      - name: Apply C526A patch
        run: |
          set -e
          cd openwrt
          PATCH="$GITHUB_WORKSPACE/0001-Added-support-for-HIWIFI-c526a-24.10.patch"

          if [ ! -f "$PATCH" ]; then
            echo "!! 补丁文件不存在：$PATCH"
            exit 1
          fi

          git config user.email "build@c526a.local"
          git config user.name "C526A Build"

          echo "=== 尝试 git am --3way ==="
          if git am --3way "$PATCH"; then
            echo "✅ git am 成功"
          else
            echo "=== git am 失败，回滚后改用 git apply --3way ==="
            git am --abort 2>/dev/null || true
            git apply --3way -v "$PATCH" || {
              echo "!! git apply 也失败，请检查补丁与源码是否匹配"
              exit 1
            }
            echo "✅ git apply 成功"
          fi

          echo "=== 补丁落地自检 ==="
          grep -q 'hiwifi_c526a' target/linux/ipq40xx/image/generic.mk \
            || { echo "!! generic.mk 里没有 hiwifi_c526a"; exit 1; }

          echo "--- files-X.Y 下的 C526A DTS ---"
          DTS_FOUND=0
          for d in target/linux/ipq40xx/files-*; do
            [ -d "$d" ] || continue
            if find "$d" -name 'qcom-ipq4019-c526a.dts' 2>/dev/null | grep -q .; then
              echo "  ✅ DTS 在 $d 下"
              DTS_FOUND=1
            fi
          done
          [ "$DTS_FOUND" -eq 1 ] || echo "  ⚠️ 未找到 DTS，可能路径不同，但继续"

          echo "--- 11-ath10k-caldata 的 c526a 分支 ---"
          CAL=target/linux/ipq40xx/base-files/etc/hotplug.d/firmware/11-ath10k-caldata
          if [ -f "$CAL" ] && grep -q 'hiwifi,c526a' "$CAL"; then
            echo "  ✅ 校准数据分支存在"
          else
            echo "  ⚠️ 11-ath10k-caldata 里没有 hiwifi,c526a 分支，无线可能无校准"
          fi

          echo "=== 补丁应用后最近提交 ==="
          git log --oneline -3

      - name: Add feeds with skip-hash (^ prefix)
        run: |
          cd openwrt
          # ^ 前缀 = 跳过该 feed 内所有包的下载哈希校验。
          # 保留官方 feeds（默认 feeds.conf.default 已有），只追加 Lienol 自家包。
          if ! grep -q 'lienol/openwrt-package' feeds.conf.default; then
            printf '%s\n' \
              '^src-git lienol https://github.com/Lienol/openwrt-package' \
              >> feeds.conf.default
          fi
          # 如果官方 feed 也需要跳过哈希（例如你换了源），给已有行也加 ^：
          # 下面这步只对未带 ^ 的 src-git 行加 ^，已带的保持不动。
          sed -i -E 's/^(src-git )/^\1/' feeds.conf.default
          # 避免重复 ^^
          sed -i 's/\^\^/^/g' feeds.conf.default

          echo "=== feeds.conf.default ==="
          cat -A feeds.conf.default

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "=== 确认 passwall 相关包已进入 package/feeds ==="
          find package/feeds -maxdepth 3 -type d \
            \( -name 'luci-app-passwall' -o -name 'luci-app-passwall2' \
               -o -name 'xray-core' -o -name 'sing-box' \) 2>/dev/null || true

      - name: Load config
        run: |
          set -e
          cd openwrt
          CFG="$GITHUB_WORKSPACE/config-lienol-c526a"
          if [ ! -f "$CFG" ]; then
            echo "!! 缺少 config 种子文件：$CFG"
            exit 1
          fi
          cp "$CFG" .config
          echo "=== 第一轮 defconfig（解析 select 依赖）==="
          make defconfig
          echo "=== 第二轮 defconfig（收敛）==="
          make defconfig

          echo "=== 正向断言：关键配置项必须为 y ==="
          FAIL=0
          for opt in \
            CONFIG_TARGET_ipq40xx_generic_DEVICE_hiwifi_c526a \
            CONFIG_PACKAGE_luci-app-passwall \
            CONFIG_PACKAGE_luci-app-passwall2 \
            CONFIG_PACKAGE_xray-core \
            CONFIG_PACKAGE_sing-box \
            CONFIG_PACKAGE_chinadns-ng \
            CONFIG_PACKAGE_ipt2socks \
            CONFIG_PACKAGE_kmod-nft-socket \
            CONFIG_PACKAGE_kmod-nft-tproxy ; do
            if grep -qx "${opt}=y" .config; then
              echo "  [OK]   ${opt}=y"
            else
              echo "  [MISS] ${opt}"
              FAIL=1
            fi
          done

          echo "=== 反向断言：legacy iptables 不能为 y ==="
          for opt in CONFIG_PACKAGE_iptables-zz-legacy CONFIG_PACKAGE_iptables-legacy ; do
            if grep -qx "${opt}=y" .config; then
              echo "  [BAD]  ${opt}=y —— 与 nftables 模式冲突"
              FAIL=1
            else
              echo "  [OK]   ${opt} 不是 y"
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "!! 关键配置检查失败，提前退出"
            echo "--- .config 中 ipq40xx 设备项 ---"
            grep -E '^CONFIG_TARGET_ipq40xx_generic_DEVICE_' .config || echo "  (无)"
            echo "--- .config 中 passwall 相关 ---"
            grep -E '^CONFIG_PACKAGE_(luci-app-passwall|xray-core|sing-box)' .config || echo "  (无)"
            exit 1
          fi
          echo "✅ .config 关键配置检查通过"
          wc -l .config

      - name: Download package sources
        run: |
          cd openwrt
          make -j$(nproc) download

      - name: Build
        run: |
          set -o pipefail
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Show tail of build log
        if: always()
        run: |
          cd openwrt
          tail -120 build.log || true
          echo "=== 错误行 ==="
          grep -n -i -E "error|failed to build" build.log | tail -60 || true

      - name: Assert firmware produced
        if: always()
        run: |
          cd openwrt
          echo "=== bin/targets/ipq40xx 实际内容 ==="
          find bin/targets/ipq40xx -type f 2>/dev/null | head -40 || true
          echo ""

          FAIL=0

          echo "=== ① .config 里的 C526A 设备项 ==="
          DEV_OPT='CONFIG_TARGET_ipq40xx_generic_DEVICE_hiwifi_c526a=y'
          if grep -qx "$DEV_OPT" .config; then
            echo "  [OK] $DEV_OPT"
          else
            echo "  [MISS] $DEV_OPT"
            grep -E '^CONFIG_TARGET_ipq40xx_generic_DEVICE_' .config || echo "    (一个都没有)"
            FAIL=1
          fi
          echo ""

          echo "=== ② bin/targets/ipq40xx/generic 下的 C526A 镜像 ==="
          ls -la bin/targets/ipq40xx/generic/ 2>/dev/null || echo "  (目录不存在)"
          echo ""

          SU=$(find bin/targets/ipq40xx/generic -maxdepth 1 -type f \
                 -name '*hiwifi_c526a*sysupgrade.bin' -print -quit 2>/dev/null || true)
          if [ -n "$SU" ] && [ -s "$SU" ]; then
            echo "  [OK] C526A sysupgrade = $SU  ($(wc -c < "$SU") B)"
          else
            echo "  [MISS] 未产出 C526A sysupgrade.bin"
            FAIL=1
          fi

          FU=$(find bin/targets/ipq40xx/generic -maxdepth 1 -type f \
                 -name '*hiwifi_c526a*squashfs-factory.ubi' -print -quit 2>/dev/null || true)
          if [ -n "$FU" ] && [ -s "$FU" ]; then
            echo "  [OK] C526A factory.ubi  = $FU  ($(wc -c < "$FU") B)"
          else
            echo "  [MISS] 未产出 C526A factory.ubi"
            FAIL=1
          fi

          IR=$(find bin/targets/ipq40xx/generic -maxdepth 1 -type f \
                 -name '*hiwifi_c526a*initramfs*' -print -quit 2>/dev/null || true)
          if [ -n "$IR" ] && [ -s "$IR" ]; then
            echo "  [OK] C526A initramfs    = $IR  ($(wc -c < "$IR") B)"
          else
            echo "  [MISS] 未产出 C526A initramfs"
            FAIL=1
          fi
          echo ""

          if [ "$FAIL" -ne 0 ]; then
            echo "!! 产物断言失败：未产出完整的 C526A 固件。"
            tail -60 build.log 2>/dev/null || true
            exit 1
          fi
          echo "=== 产物断言通过：C526A 三种镜像齐全 ==="

      - name: Prepare artifacts
        if: always()
        run: |
          mkdir -p output
          cd openwrt
          find bin/targets/ipq40xx -type f \( -name "*.bin" -o -name "*.ubi" -o -name "*.itb" \
            -o -name "*metadata*" -o -name "profiles.json" -o -name "*.buildinfo" \) \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \; 2>/dev/null || true
          find bin/packages -type f -name "*passwall*" \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \; 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/output/"
          cat bin/targets/ipq40xx/generic/*.buildinfo 2>/dev/null || true

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c526a-lienol-24.10-passwall-firmware
          path: output/
          if-no-files-found: error
          retention-days: 30
