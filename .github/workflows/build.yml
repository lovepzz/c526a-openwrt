name: Build C526A (OpenWrt 25.12.6 + ipqess + WiFi)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget ccache \
            libelf-dev python3-pyelftools

      - name: Clone OpenWrt (openwrt-25.12 @ v25.12.6 commit)
        env:
          # v25.12.6 对应的 commit（内核 6.12.112）
          # 来源：https://git.openwrt.org/openwrt/openwrt/log/?h=openwrt-25.12
          OPENWRT_COMMIT: 450459bef3b5ba2414abf68feafe60446f53db51
        run: |
          set -e
          git init openwrt
          cd openwrt
          git remote add origin https://github.com/openwrt/openwrt.git
          git fetch --depth 1 origin "$OPENWRT_COMMIT"
          git checkout --detach FETCH_HEAD
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$OPENWRT_COMMIT" ]; then
            echo "!! HEAD mismatch"; exit 1
          fi
          echo "OK: $ACTUAL"
          grep -E '^LINUX_VERSION-' include/kernel-version.mk || true

      - name: Apply C526A patch
        run: |
          set -e
          cd openwrt
          git config user.email "build@c526a.local"
          git config user.name "C526A Build"
          git am --3way "$GITHUB_WORKSPACE/0001-Added-support-for-HIWIFI-c526a-25.12.patch" \
            || (git am --abort 2>/dev/null || true; \
                git apply --3way -v "$GITHUB_WORKSPACE/0001-Added-support-for-HIWIFI-c526a-25.12.patch")
          test -f target/linux/ipq40xx/files-6.12/arch/arm/boot/dts/qcom/qcom-ipq4019-c526a.dts \
            || { echo "!! DTS 不存在"; exit 1; }
          grep -q 'hiwifi_c526a' target/linux/ipq40xx/image/generic.mk \
            || { echo "!! generic.mk 缺失"; exit 1; }

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ================================================================
      # 关键：启用 Wi-Fi 并设置 LAN IP 为 10.0.0.3
      # 通过 /etc/uci-defaults 脚本在首次启动时自动执行，
      # 无需手动登录 LuCI 修改。
      # 参考：https://openwrt.org/docs/guide-developer/uci-defaults
      # ================================================================
      - name: Add uci-defaults for WiFi & LAN IP
        run: |
          set -e
          cd openwrt
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-c526a-custom <<'EOF'
          #!/bin/sh
          # 设置 LAN IP 为 10.0.0.3/24
          uci set network.lan.ipaddr='10.0.0.3'
          uci set network.lan.netmask='255.255.255.0'
          uci commit network

          # 启用所有 Wi-Fi 射频（wifi0/wifi1/wifi2）
          uci set wireless.@wifi-device[0].disabled='0'
          uci set wireless.@wifi-device[1].disabled='0'
          uci set wireless.@wifi-device[2].disabled='0'
          uci commit wireless

          # 可选：设置 SSID（如需要可取消注释）
          # uci set wireless.@wifi-iface[0].ssid='C526A-2G'
          # uci set wireless.@wifi-iface[1].ssid='C526A-5G'
          # uci commit wireless

          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-c526a-custom
          echo "=== uci-defaults 已写入 ==="
          cat files/etc/uci-defaults/99-c526a-custom

      - name: Load config
        run: |
          set -e
          cd openwrt
          cp "$GITHUB_WORKSPACE/config-25.12-c526a" .config
          make defconfig

          # 确保 Wi-Fi 驱动与 wpad 被选中（官方默认通常是 wpad-basic-mbedtls）
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-ath10k-ct=y
          CONFIG_PACKAGE_ath10k-firmware-qca4019-ct=y
          CONFIG_PACKAGE_wpad-basic-mbedtls=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb2=y
          EOF

          # 再次 defconfig 收敛依赖（但不再修改关键开关）
          make defconfig

          echo "=== 关键配置确认 ==="
          grep -E 'CONFIG_TARGET_ipq40xx|CONFIG_PACKAGE_(kmod-ath10k|wpad|kmod-usb)' .config || true
          ls -la .config && wc -l .config

      - name: Verify target and driver
        run: |
          cd openwrt
          FAIL=0
          echo "=== target ==="
          grep -E 'CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)' .config || true
          echo ""
          echo "=== 设备定义 ==="
          grep -A20 'define Device/hiwifi_c526a' target/linux/ipq40xx/image/generic.mk \
            || { echo "!! generic.mk 缺失"; FAIL=1; }
          echo ""
          echo "=== DTS ==="
          ls -la target/linux/ipq40xx/files-6.12/arch/arm/boot/dts/qcom/qcom-ipq4019-c526a.dts \
            || { echo "!! DTS 未落地"; FAIL=1; }
          echo ""
          echo "=== ipqess 补丁数（期望 >=6）==="
          n=$(ls target/linux/ipq40xx/patches-6.12/ 2>/dev/null | grep -ci ipqess || true); n=${n:-0}
          echo "ipqess 补丁数 = $n"
          [ "$n" -ge 6 ] || { echo "!! ipqess 补丁不足"; FAIL=1; }
          echo ""
          echo "=== Wi-Fi 驱动配置 ==="
          for opt in CONFIG_PACKAGE_kmod-ath10k-ct \
                     CONFIG_PACKAGE_ath10k-firmware-qca4019-ct \
                     CONFIG_PACKAGE_wpad-basic-mbedtls ; do
            if grep -qx "${opt}=y" .config; then
              echo "  [OK]   ${opt}=y"
            else
              echo "  [MISS] ${opt}"
              FAIL=1
            fi
          done
          echo ""
          echo "=== uci-defaults 文件 ==="
          test -f files/etc/uci-defaults/99-c526a-custom \
            || { echo "!! uci-defaults 缺失"; FAIL=1; }
          grep -q "10.0.0.3" files/etc/uci-defaults/99-c526a-custom \
            || { echo "!! LAN IP 未设置为 10.0.0.3"; FAIL=1; }
          grep -q "wireless.@wifi-device\[0\].disabled='0'" files/etc/uci-defaults/99-c526a-custom \
            || { echo "!! WiFi 启用指令缺失"; FAIL=1; }
          echo "OK: uci-defaults 包含 LAN IP 与 WiFi 启用"
          if [ "$FAIL" -ne 0 ]; then
            echo "!! 自检失败"; exit 1
          fi
          echo "=== 全部自检通过 ==="

      - name: Download package sources
        run: |
          cd openwrt
          make -j$(nproc) download

      - name: Build
        run: |
          set -o pipefail
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: Show tail of build log
        if: always()
        run: |
          cd openwrt
          tail -120 build.log || true
          echo "=== 错误行 ==="
          grep -n -i -E "error|failed to build" build.log | tail -60 || true

      - name: Assert firmware produced
        if: always()
        run: |
          cd openwrt
          FAIL=0
          echo "=== bin/targets/ipq40xx/generic 内容 ==="
          find bin/targets/ipq40xx/generic -type f 2>/dev/null | head -40 || true
          echo ""
          DEV_OPT='CONFIG_TARGET_ipq40xx_generic_DEVICE_hiwifi_c526a=y'
          if grep -qx "$DEV_OPT" .config; then
            echo "  [OK] $DEV_OPT"
          else
            echo "  [MISS] $DEV_OPT"; FAIL=1
          fi
          SU=$(find bin/targets/ipq40xx/generic -maxdepth 1 -type f \
                 -name '*hiwifi_c526a*sysupgrade.bin' -print -quit 2>/dev/null || true)
          if [ -n "$SU" ] && [ -s "$SU" ]; then
            echo "  [OK] sysupgrade = $SU ($(wc -c < "$SU") B)"
          else
            echo "  [MISS] sysupgrade.bin"; FAIL=1
          fi
          FU=$(find bin/targets/ipq40xx/generic -maxdepth 1 -type f \
                 -name '*hiwifi_c526a*squashfs-factory.ubi' -print -quit 2>/dev/null || true)
          if [ -n "$FU" ] && [ -s "$FU" ]; then
            echo "  [OK] factory.ubi = $FU ($(wc -c < "$FU") B)"
          else
            echo "  [MISS] factory.ubi"; FAIL=1
          fi
          IR=$(find bin/targets/ipq40xx/generic -maxdepth 1 -type f \
                 -name '*hiwifi_c526a*initramfs*' -print -quit 2>/dev/null || true)
          if [ -n "$IR" ] && [ -s "$IR" ]; then
            echo "  [OK] initramfs = $IR ($(wc -c < "$IR") B)"
          else
            echo "  [MISS] initramfs"; FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "!! 产物断言失败"; exit 1
          fi
          echo "=== 产物断言通过 ==="

      - name: Prepare artifacts
        if: always()
        run: |
          mkdir -p output
          cd openwrt
          find bin/targets/ipq40xx -type f \( -name "*.bin" -o -name "*.ubi" -o -name "*.itb" \
            -o -name "*metadata*" -o -name "profiles.json" -o -name "*.buildinfo" \) \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \; 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/output/"
          cat bin/targets/ipq40xx/generic/*.buildinfo 2>/dev/null || true

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c526a-25.12.6-ipqess-wifi-firmware
          path: output/
          if-no-files-found: error
          retention-days: 30
