# ============================================================================
# HiWiFi C526A (极路由X) — OpenWrt 24.10 + LuCI 中文 + 三频 WiFi + 功率解锁
#
# 硬件射频分配：
#   MT7615（PCIe，phy0）    = 2.4G + 5G 高频
#   QCA4019 a000000（phy1） = 5G
#   QCA4019 a800000（phy2） = 5G
#
# 关键修复：
#   1) MT7615 节点加 mediatek,mtd-eeprom = <&factory 0x0>;
#      从 Factory 分区读 EEPROM，解决 2.4G 只有 6 dBm 和 MAC 随机的问题
#   2) regdb 解锁功率 + ATH_USER_REGD
#   3) dnsmasq-full + nf-conntrack-netlink（修复 DHCP）
#
# 需要放在仓库根目录的文件：
#   - 0001-Added-support-for-HIWIFI-c526a-24.10.patch
#   - config-24.10-c526a
# ============================================================================

name: Build C526A

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-24.10

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repo files
        run: |
          ls -la
          test -f 0001-Added-support-for-HIWIFI-c526a-24.10.patch || { echo "缺少 C526A 补丁"; exit 1; }
          test -f config-24.10-c526a || { echo "缺少 config-24.10-c526a"; exit 1; }
          echo OK

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget ccache \
            libelf-dev python3-pyelftools

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref }}-
            ccache-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true
          ccache -z
          ccache -s

      - name: Clone OpenWrt 24.10
        run: |
          set -e
          git clone --depth 1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          git log --oneline -1
          grep -E '^LINUX_VERSION-' include/kernel-version.mk || true

      - name: Apply C526A patch
        run: |
          set -e
          cd openwrt
          PATCH="$GITHUB_WORKSPACE/0001-Added-support-for-HIWIFI-c526a-24.10.patch"
          git config user.email "build@c526a.local"
          git config user.name "C526A Build"
          if git am --3way "$PATCH"; then
            echo "git am 成功"
          else
            echo "git am 失败，改用 git apply --3way"
            git am --abort 2>/dev/null || true
            git apply --3way -v "$PATCH" || { echo "补丁无法应用"; exit 1; }
          fi
          grep -q 'hiwifi_c526a' target/linux/ipq40xx/image/generic.mk || { echo "generic.mk 缺 c526a"; exit 1; }
          grep -q 'hiwifi,c526a' target/linux/ipq40xx/base-files/etc/board.d/02_network || { echo "02_network 缺 c526a"; exit 1; }
          grep -q 'hiwifi,c526a' target/linux/ipq40xx/base-files/etc/hotplug.d/firmware/11-ath10k-caldata || { echo "11-ath10k-caldata 缺 c526a"; exit 1; }
          test -f target/linux/ipq40xx/files-6.6/arch/arm/boot/dts/qcom/qcom-ipq4019-c526a.dts || { echo "DTS 未落地"; exit 1; }
          echo "补丁自检通过"

      - name: Debug original DTS
        run: |
          cd openwrt
          DTS=target/linux/ipq40xx/files-6.6/arch/arm/boot/dts/qcom/qcom-ipq4019-c526a.dts
          echo "=== 原始 DTS 里的 &pcie0 ==="
          grep -n -A15 "&pcie0" "$DTS" || echo "无 &pcie0"
          echo "=== 原始 DTS 里的 &wifi0 / &wifi1 ==="
          grep -n -A5 "^&wifi" "$DTS" || echo "无 &wifi0 / &wifi1"

      # ==========================================================================
      # 解锁功率：修改 regdb
      # ==========================================================================
      - name: Unlock power limit in regdb
        run: |
          set -e
          cd openwrt
          REGDB="package/firmware/wireless-regdb/db.txt"
          if [ ! -f "$REGDB" ]; then
            REGDB="package/kernel/mac80211/files/regdb.txt"
          fi
          if [ ! -f "$REGDB" ]; then
            echo "未找到 regdb，跳过"
            exit 0
          fi
          echo "找到 regdb: $REGDB"
          cp "$REGDB" "${REGDB}.bak"
          sed -i -E 's#\(2402 - 2472 @ 40\), \(N/A, [0-9]+\)#(2402 - 2472 @ 40), (N/A, 30)#g' "$REGDB"
          sed -i -E 's#\((51[57]0) - 5250 @ 80\), \(N/A, [0-9]+\)#(\1 - 5250 @ 80), (N/A, 30)#g' "$REGDB"
          sed -i -E 's#\(5250 - 5330 @ 80\), \(N/A, [0-9]+\)#(5250 - 5330 @ 80), (N/A, 30)#g' "$REGDB"
          sed -i -E 's#\(5490 - 5710 @ 80\), \(N/A, [0-9]+\)#(5490 - 5710 @ 80), (N/A, 30)#g' "$REGDB"
          sed -i -E 's#\(5735 - 5835 @ 80\), \(N/A, [0-9]+\)#(5735 - 5835 @ 80), (N/A, 30)#g' "$REGDB"
          echo "=== 修改后功率行 ==="
          grep -E "2402 - 2472|5150 - 5250|5170 - 5250|5250 - 5330|5490 - 5710|5735 - 5835" "$REGDB" | head -20 || true

      # ==========================================================================
      # 启用三频 WiFi（关键修复：MT7615 加 EEPROM 引用）
      # ==========================================================================
      - name: Enable 3-band WiFi in DTS
        run: |
          set -e
          cd openwrt
          DTS=target/linux/ipq40xx/files-6.6/arch/arm/boot/dts/qcom/qcom-ipq4019-c526a.dts

          if grep -q '^&wifi0' "$DTS"; then
            echo "DTS 中已存在 &wifi0，跳过"
          else
            {
              echo ""
              echo '&wifi0 {'
              echo '    status = "okay";'
              echo '    qcom,ath10k-calibration-variant = "C526A";'
              echo '};'
              echo ""
              echo '&wifi1 {'
              echo '    status = "okay";'
              echo '    qcom,ath10k-calibration-variant = "C526A";'
              echo '};'
            } >> "$DTS"
            echo "已追加 &wifi0 / &wifi1"
          fi

          # MT7615：加 EEPROM 引用，解决 2.4G 6 dBm
          if ! grep -q 'mediatek,mt76' "$DTS"; then
            {
              echo ""
              echo '&pcie0 {'
              echo '    bridge@0,0 {'
              echo '        wifi@0,0 {'
              echo '            compatible = "mediatek,mt76";'
              echo '            reg = <0x0000 0 0 0 0>;'
              echo '            mediatek,mtd-eeprom = <&factory 0x0>;'
              echo '        };'
              echo '    };'
              echo '};'
            } >> "$DTS"
            echo "已追加 MT7615 节点（含 EEPROM 引用）"
          else
            echo "DTS 中已存在 mediatek,mt76，跳过"
          fi

          echo "=== DTS 末尾 50 行 ==="
          tail -50 "$DTS"

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Remove radicale3 broken dependency
        run: |
          cd openwrt
          if [ -f feeds/luci/applications/luci-app-radicale3/Makefile ]; then
            sed -i 's/ +rpcd-mod-rad3-enc//g' feeds/luci/applications/luci-app-radicale3/Makefile
          fi
          if [ -f package/feeds/luci/luci-app-radicale3/Makefile ]; then
            sed -i 's/ +rpcd-mod-rad3-enc//g' package/feeds/luci/luci-app-radicale3/Makefile
          fi

      - name: Set default LAN IP to 10.0.0.5
        run: |
          set -e
          cd openwrt
          mkdir -p files/etc/uci-defaults
          {
            echo '#!/bin/sh'
            echo "uci set network.lan.ipaddr='10.0.0.5'"
            echo "uci set network.lan.netmask='255.255.255.0'"
            echo "uci -q delete dhcp.lan.dhcp_option || true"
            echo "uci add_list dhcp.lan.dhcp_option='3,10.0.0.5'"
            echo "uci add_list dhcp.lan.dhcp_option='6,10.0.0.5'"
            echo "uci commit network"
            echo "uci commit dhcp"
            echo "exit 0"
          } > files/etc/uci-defaults/99-custom-lan-ip
          chmod +x files/etc/uci-defaults/99-custom-lan-ip
          echo "=== LAN 默认配置 ==="
          cat files/etc/uci-defaults/99-custom-lan-ip

      # ==========================================================================
      # 无线默认配置（只启用 phy2 / radio2 作为主力 AP）
      #   radio0 (MT7615)  → 2.4G
      #   radio1 (a000000) → 5G 36
      #   radio2 (a800000) → 5G 149
      # ==========================================================================
      - name: Set default wireless config
        run: |
          set -e
          cd openwrt
          mkdir -p files/etc/uci-defaults
          {
            echo '#!/bin/sh'
            echo ""
            echo "# MT7615 - 2.4G"
            echo "uci set wireless.radio0.band='2g' 2>/dev/null || true"
            echo "uci set wireless.radio0.channel='6'"
            echo "uci set wireless.radio0.htmode='HT20'"
            echo "uci set wireless.radio0.disabled='0'"
            echo ""
            echo "# QCA4019 a000000 - 5G 低频"
            echo "uci set wireless.radio1.band='5g' 2>/dev/null || true"
            echo "uci set wireless.radio1.channel='36'"
            echo "uci set wireless.radio1.htmode='VHT80'"
            echo "uci set wireless.radio1.disabled='0'"
            echo ""
            echo "# QCA4019 a800000 - 5G 高频"
            echo "uci set wireless.radio2.band='5g' 2>/dev/null || true"
            echo "uci set wireless.radio2.channel='149'"
            echo "uci set wireless.radio2.htmode='VHT80'"
            echo "uci set wireless.radio2.disabled='0'"
            echo ""
            echo "uci commit wireless"
            echo "exit 0"
          } > files/etc/uci-defaults/98-custom-wireless
          chmod +x files/etc/uci-defaults/98-custom-wireless
          echo "=== 无线默认配置 ==="
          cat files/etc/uci-defaults/98-custom-wireless

      - name: Load config
        run: |
          set -e
          cd openwrt
          cp "$GITHUB_WORKSPACE/config-24.10-c526a" .config

          # DHCP 修复
          echo "CONFIG_PACKAGE_dnsmasq=n" >> .config
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y" >> .config

          # 功率解锁
          echo "CONFIG_ATH_USER_REGD=y" >> .config
          echo "CONFIG_CFG80211_CERTIFICATION_ONUS=y" >> .config

          # 双频 QCA4019 驱动
          echo "CONFIG_PACKAGE_kmod-ath10k-ct=y" >> .config
          echo "CONFIG_PACKAGE_ath10k-firmware-qca4019-ct=y" >> .config
          echo "CONFIG_PACKAGE_ath10k-firmware-qca4019-ct-htt=y" >> .config

          # MT7615 驱动（提供 2.4G）
          echo "CONFIG_PACKAGE_kmod-mt7615e=y" >> .config

          echo "=== 第一轮 defconfig ==="
          make defconfig
          echo "=== 第二轮 defconfig ==="
          make defconfig

          echo "=== 探测 MT7615 固件包 ==="
          if grep -rq 'KernelPackage/mt7615-firmware' package/kernel/mt76/Makefile 2>/dev/null; then
            echo "  OK: 存在 mt7615-firmware"
            if ! grep -qx 'CONFIG_PACKAGE_kmod-mt7615-firmware=y' .config; then
              echo "CONFIG_PACKAGE_kmod-mt7615-firmware=y" >> .config
            fi
          fi
          make defconfig

          echo "=== 关键选项检查 ==="
          for opt in \
            CONFIG_TARGET_ipq40xx_generic_DEVICE_hiwifi_c526a \
            CONFIG_PACKAGE_luci \
            CONFIG_PACKAGE_dnsmasq-full \
            CONFIG_PACKAGE_kmod-nf-conntrack-netlink \
            CONFIG_ATH_USER_REGD \
            CONFIG_PACKAGE_kmod-ath10k-ct \
            CONFIG_PACKAGE_kmod-mt7615e ; do
            grep -qx "${opt}=y" .config && echo "  OK   ${opt}=y" || echo "  WARN ${opt} 未出现"
          done

          echo "=== MT7615 相关选项 ==="
          grep -E 'mt7615' .config || echo "  未找到 mt7615 选项"

          echo "config 行数: $(wc -l < .config)"
          exit 0

      - name: Download package sources
        run: |
          cd openwrt
          make -j$(nproc) download

      - name: Build
        run: |
          set -o pipefail
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Show tail of build log
        if: always()
        run: |
          cd openwrt
          tail -150 build.log || true
          echo "=== 错误行 ==="
          grep -n -i -E "error|failed to build" build.log | tail -60 || true

      - name: Assert firmware produced
        if: always()
        run: |
          cd openwrt
          ls -la bin/targets/ipq40xx/generic/ 2>/dev/null || true
          FAIL=0
          grep -qx 'CONFIG_TARGET_ipq40xx_generic_DEVICE_hiwifi_c526a=y' .config || { echo "  MISS 设备项"; FAIL=1; }
          SU=$(find bin/targets/ipq40xx/generic -maxdepth 1 -type f -name '*hiwifi_c526a*sysupgrade.bin' -print -quit 2>/dev/null || true)
          [ -n "$SU" ] && [ -s "$SU" ] && echo "  OK sysupgrade=$SU" || { echo "  MISS sysupgrade"; FAIL=1; }
          FU=$(find bin/targets/ipq40xx/generic -maxdepth 1 -type f -name '*hiwifi_c526a*squashfs-factory.ubi' -print -quit 2>/dev/null || true)
          [ -n "$FU" ] && [ -s "$FU" ] && echo "  OK factory.ubi=$FU" || { echo "  MISS factory.ubi"; FAIL=1; }
          IR=$(find bin/targets/ipq40xx/generic -maxdepth 1 -type f -name '*hiwifi_c526a*initramfs*' -print -quit 2>/dev/null || true)
          [ -n "$IR" ] && [ -s "$IR" ] && echo "  OK initramfs=$IR" || { echo "  MISS initramfs"; FAIL=1; }
          [ "$FAIL" -eq 0 ] || { echo "产物断言失败"; tail -60 build.log; exit 1; }
          echo "产物断言通过"

      - name: Prepare artifacts
        if: always()
        run: |
          mkdir -p output
          cd openwrt
          find bin/targets/ipq40xx -type f \( -name "*.bin" -o -name "*.ubi" -o -name "*.itb" -o -name "*metadata*" -o -name "profiles.json" -o -name "*.buildinfo" \) -exec cp {} "$GITHUB_WORKSPACE/output/" \; 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/output/"

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c526a-firmware
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log
          if-no-files-found: ignore
          retention-days: 7
