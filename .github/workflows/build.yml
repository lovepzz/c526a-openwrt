# ============================================================================
# HiWiFi C526A (极路由X) — OpenWrt 24.10 + LuCI 中文 + 三频 WiFi + 功率解锁
#
# 射频归属：
#   &wifi0           = QCA4019 内置 2.4G (AHB)
#   &wifi1           = QCA4019 内置 5G  (AHB)
#   &pcie0/wifi@0,0  = MT7615 外挂 5G  (PCIe)
#
# ⚠️ IPQ4019 dtsi 只有 wifi0 和 wifi1，不存在 &wifi2
# ============================================================================

name: Build C526A

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-24.10

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repo files
        run: |
          ls -la
          test -f 0001-Added-support-for-HIWIFI-c526a-24.10.patch || { echo "缺少 C526A 补丁"; exit 1; }
          test -f config-24.10-c526a || { echo "缺少 config-24.10-c526a"; exit 1; }
          echo OK

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget ccache \
            libelf-dev python3-pyelftools

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref }}-
            ccache-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true
          ccache -z
          ccache -s

      - name: Clone OpenWrt 24.10
        run: |
          set -e
          git clone --depth 1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          git log --oneline -1
          grep -E '^LINUX_VERSION-' include/kernel-version.mk || true

      - name: Apply C526A patch
        run: |
          set -e
          cd openwrt
          PATCH="$GITHUB_WORKSPACE/0001-Added-support-for-HIWIFI-c526a-24.10.patch"
          git config user.email "build@c526a.local"
          git config user.name "C526A Build"
          if git am --3way "$PATCH"; then
            echo "git am 成功"
          else
            echo "git am 失败，改用 git apply --3way"
            git am --abort 2>/dev/null || true
            git apply --3way -v "$PATCH" || { echo "补丁无法应用"; exit 1; }
          fi
          grep -q 'hiwifi_c526a' target/linux/ipq40xx/image/generic.mk || { echo "generic.mk 缺 c526a"; exit 1; }
          grep -q 'hiwifi,c526a' target/linux/ipq40xx/base-files/etc/board.d/02_network || { echo "02_network 缺 c526a"; exit 1; }
          grep -q 'hiwifi,c526a' target/linux/ipq40xx/base-files/etc/hotplug.d/firmware/11-ath10k-caldata || { echo "11-ath10k-caldata 缺 c526a"; exit 1; }
          test -f target/linux/ipq40xx/files-6.6/arch/arm/boot/dts/qcom/qcom-ipq4019-c526a.dts || { echo "DTS 未落地"; exit 1; }
          echo "补丁自检通过"

      - name: Debug DTS nodes
        run: |
          cd openwrt
          DTS=target/linux/ipq40xx/files-6.6/arch/arm/boot/dts/qcom/qcom-ipq4019-c526a.dts
          echo "=== wifi / pcie 相关行 ==="
          grep -n -E "wifi|pcie|mt76|mt7615" "$DTS" || echo "NONE"
          echo "=== DTS 末尾 60 行 ==="
          tail -60 "$DTS"

      - name: Unlock power limit in regdb
        run: |
          set -e
          cd openwrt
          REGDB="package/firmware/wireless-regdb/db.txt"
          if [ ! -f "$REGDB" ]; then
            REGDB="package/kernel/mac80211/files/regdb.txt"
          fi
          if [ ! -f "$REGDB" ]; then
            echo "未找到 regdb，跳过"
            exit 0
          fi
          echo "找到 regdb: $REGDB"
          cp "$REGDB" "${REGDB}.bak"
          sed -i -E 's#\(2402 - 2472 @ 40\), \(N/A, [0-9]+\)#(2402 - 2472 @ 40), (N/A, 30)#g' "$REGDB"
          sed -i -E 's#\(5170 - 5250 @ 80\), \(N/A, [0-9]+\)#(5170 - 5250 @ 80), (N/A, 30)#g' "$REGDB"
          sed -i -E 's#\(5250 - 5330 @ 80\), \(N/A, [0-9]+\)#(5250 - 5330 @ 80), (N/A, 30)#g' "$REGDB"
          sed -i -E 's#\(5490 - 5710 @ 80\), \(N/A, [0-9]+\)#(5490 - 5710 @ 80), (N/A, 30)#g' "$REGDB"
          sed -i -E 's#\(5735 - 5835 @ 80\), \(N/A, [0-9]+\)#(5735 - 5835 @ 80), (N/A, 30)#g' "$REGDB"
          echo "=== 修改后 ==="
          grep -E "2402 - 2472|5170 - 5250|5250 - 5330|5490 - 5710|5735 - 5835" "$REGDB" | head -20 || true

      - name: Enable 3-band WiFi in DTS
        run: |
          set -e
          cd openwrt
          DTS=target/linux/ipq40xx/files-6.6/arch/arm/boot/dts/qcom/qcom-ipq4019-c526a.dts
          if grep -q '^&wifi0' "$DTS"; then
            echo "DTS 中已存在 &wifi0，跳过"
          else
            echo "" >> "$DTS"
            echo "&wifi0 {" >> "$DTS"
            echo '    status = "okay";' >> "$DTS"
            echo '    qcom,ath10k-calibration-variant = "C526A";' >> "$DTS"
            echo '    ieee80211-freq-limit = <2401000 2495000>;' >> "$DTS"
            echo "};" >> "$DTS"
            echo "" >> "$DTS"
            echo "&wifi1 {" >> "$DTS"
            echo '    status = "okay";' >> "$DTS"
            echo '    qcom,ath10k-calibration-variant = "C526A";' >> "$DTS"
            echo '    ieee80211-freq-limit = <5170000 5330000>;' >> "$DTS"
            echo "};" >> "$DTS"
            echo "" >> "$DTS"
            echo "&pcie0 {" >> "$DTS"
            echo "    bridge@0,0 {" >> "$DTS"
            echo "        wifi@0,0 {" >> "$DTS"
            echo '            compatible = "mediatek,mt76";' >> "$DTS"
            echo '            reg = <0x0000 0 0 0 0>;' >> "$DTS"
            echo '            mediatek,mtd-eeprom = <&factory 0x0>;' >> "$DTS"
            echo '            ieee80211-freq-limit = <5490000 5835000>;' >> "$DTS"
            echo "        };" >> "$DTS"
            echo "    };" >> "$DTS"
            echo "};" >> "$DTS"
            echo "已追加三频节点"
          fi
          echo "=== DTS 末尾 50 行 ==="
          tail -50 "$DTS"

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Remove radicale3 broken dependency
        run: |
          cd openwrt
          if [ -f feeds/luci/applications/luci-app-radicale3/Makefile ]; then
            sed -i 's/ +rpcd-mod-rad3-enc//g' feeds/luci/applications/luci-app-radicale3/Makefile
          fi
          if [ -f package/feeds/luci/luci-app-radicale3/Makefile ]; then
            sed -i 's/ +rpcd-mod-rad3-enc//g' package/feeds/luci/luci-app-radicale3/Makefile
          fi

      - name: Set default LAN IP
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults
          LANFILE=files/etc/uci-defaults/99-custom-lan-ip
          echo '#!/bin/sh' > "$LANFILE"
          echo "uci set network.lan.ipaddr='10.0.0.5'" >> "$LANFILE"
          echo "uci set network.lan.netmask='255.255.255.0'" >> "$LANFILE"
          echo "uci -q delete dhcp.lan.dhcp_option || true" >> "$LANFILE"
          echo "uci add_list dhcp.lan.dhcp_option='3,10.0.0.5'" >> "$LANFILE"
          echo "uci add_list dhcp.lan.dhcp_option='6,10.0.0.5'" >> "$LANFILE"
          echo "uci commit network" >> "$LANFILE"
          echo "uci commit dhcp" >> "$LANFILE"
          echo "exit 0" >> "$LANFILE"
          chmod +x "$LANFILE"
          echo "=== 内容 ==="
          cat "$LANFILE"

      - name: Set default wireless config
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults
          WFILE=files/etc/uci-defaults/98-custom-wireless
          echo '#!/bin/sh' > "$WFILE"
          echo "" >> "$WFILE"
          echo "# 2.4G" >> "$WFILE"
          echo "uci set wireless.radio0.country='00'" >> "$WFILE"
          echo "uci set wireless.radio0.channel='6'" >> "$WFILE"
          echo "uci set wireless.radio0.htmode='HT20'" >> "$WFILE"
          echo "uci set wireless.radio0.disabled='0'" >> "$WFILE"
          echo "" >> "$WFILE"
          echo "# 5G 低频" >> "$WFILE"
          echo "uci set wireless.radio1.country='00'" >> "$WFILE"
          echo "uci set wireless.radio1.channel='36'" >> "$WFILE"
          echo "uci set wireless.radio1.htmode='VHT80'" >> "$WFILE"
          echo "uci set wireless.radio1.disabled='0'" >> "$WFILE"
          echo "" >> "$WFILE"
          echo "# 5G 高频" >> "$WFILE"
          echo "uci set wireless.radio2.country='00'" >> "$WFILE"
          echo "uci set wireless.radio2.channel='149'" >> "$WFILE"
          echo "uci set wireless.radio2.htmode='VHT80'" >> "$WFILE"
          echo "uci set wireless.radio2.disabled='0'" >> "$WFILE"
          echo "" >> "$WFILE"
          echo "uci commit wireless" >> "$WFILE"
          echo "exit 0" >> "$WFILE"
          chmod +x "$WFILE"
          echo "=== 内容 ==="
          cat "$WFILE"

      - name: Load config
        run: |
          set -e
          cd openwrt
          cp "$GITHUB_WORKSPACE/config-24.10-c526a" .config
          echo "CONFIG_ATH_USER_REGD=y" >> .config
          echo "CONFIG_CFG80211_CERTIFICATION_ONUS=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ath10k-ct=y" >> .config
          echo "CONFIG_PACKAGE_ath10k-firmware-qca4019-ct=y" >> .config
          echo "CONFIG_PACKAGE_ath10k-firmware-qca4019-ct-htt=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7615e=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7615-firmware=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7615-common=y" >> .config
          echo "=== 第一轮 defconfig ==="
          make defconfig
          echo "=== 第二轮 defconfig ==="
          make defconfig
          echo "=== 关键选项检查 ==="
          for opt in CONFIG_TARGET_ipq40xx_generic_DEVICE_hiwifi_c526a CONFIG_PACKAGE_luci CONFIG_ATH_USER_REGD CONFIG_PACKAGE_kmod-ath10k-ct CONFIG_PACKAGE_kmod-mt7615e; do
            if grep -qx "${opt}=y" .config; then
              echo "  OK   ${opt}=y"
            else
              echo "  WARN ${opt} 未出现"
            fi
          done
          echo "config 行数: $(wc -l < .config)"
          exit 0

      - name: Download package sources
        run: |
          cd openwrt
          make -j$(nproc) download

      - name: Build
        run: |
          set -o pipefail
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Show tail of build log
        if: always()
        run: |
          cd openwrt
          tail -150 build.log || true
          echo "=== 错误行 ==="
          grep -n -i -E "error|failed to build" build.log | tail -60 || true

      - name: Assert firmware produced
        if: always()
        run: |
          cd openwrt
          ls -la bin/targets/ipq40xx/generic/ 2>/dev/null || true
          FAIL=0
          grep -qx 'CONFIG_TARGET_ipq40xx_generic_DEVICE_hiwifi_c526a=y' .config || { echo "  MISS 设备项"; FAIL=1; }
          SU=$(find bin/targets/ipq40xx/generic -maxdepth 1 -type f -name '*hiwifi_c526a*sysupgrade.bin' -print -quit 2>/dev/null || true)
          if [ -n "$SU" ] && [ -s "$SU" ]; then echo "  OK sysupgrade=$SU"; else echo "  MISS sysupgrade"; FAIL=1; fi
          FU=$(find bin/targets/ipq40xx/generic -maxdepth 1 -type f -name '*hiwifi_c526a*squashfs-factory.ubi' -print -quit 2>/dev/null || true)
          if [ -n "$FU" ] && [ -s "$FU" ]; then echo "  OK factory.ubi=$FU"; else echo "  MISS factory.ubi"; FAIL=1; fi
          IR=$(find bin/targets/ipq40xx/generic -maxdepth 1 -type f -name '*hiwifi_c526a*initramfs*' -print -quit 2>/dev/null || true)
          if [ -n "$IR" ] && [ -s "$IR" ]; then echo "  OK initramfs=$IR"; else echo "  MISS initramfs"; FAIL=1; fi
          if [ "$FAIL" -ne 0 ]; then echo "产物断言失败"; tail -80 build.log; exit 1; fi
          echo "产物断言通过"

      - name: Prepare artifacts
        if: always()
        run: |
          mkdir -p output
          cd openwrt
          find bin/targets/ipq40xx -type f \( -name "*.bin" -o -name "*.ubi" -o -name "*.itb" -o -name "*metadata*" -o -name "profiles.json" -o -name "*.buildinfo" \) -exec cp {} "$GITHUB_WORKSPACE/output/" \; 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/output/"

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c526a-firmware
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: openwrt/build.log
          if-no-files-found: ignore
          retention-days: 7
